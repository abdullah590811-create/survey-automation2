<!DOCTYPE html>

    <style>

<body class="bg-slate-100 text-slate-800 antialiased min-h-screen pb-36">

    <!-- Top Navigation Bar -->

            </div>
            <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-50 border border-emerald-200">

    <main class="max-w-2xl mx-auto p-3 sm:p-4 space-y-4">

            </div>

            <!-- Touch-Friendly Preset Buttons -->
            <div class="grid grid-cols-3 gap-2">
                <button onclick="applyPreset('pro_ai')" class="py-2.5 px-1 bg-emerald-50 hover:bg-emerald-100 active:bg-emerald-200 border border-emerald-200 rounded-xl text-center transition">
                    <div class="text-base">🚀</div>
                    <div class="text-[11px] font-bold text-emerald-900 leading-tight">Pro-AI</div>
                </button>
                <button onclick="applyPreset('balanced')" class="py-2.5 px-1 bg-teal-50 hover:bg-teal-100 active:bg-teal-200 border border-teal-300 rounded-xl text-center transition ring-1 ring-teal-500/30">
                    <div class="text-base">⚖️</div>
                    <div class="text-[11px] font-bold text-teal-900 leading-tight">Balanced</div>

                <button onclick="applyPreset('skeptical')" class="py-2.5 px-1 bg-rose-50 hover:bg-rose-100 active:bg-rose-200 border border-rose-200 rounded-xl text-center transition">

            </div>

            <label class="flex items-center space-x-2 text-xs font-semibold text-slate-700 cursor-pointer pt-1">

            </label>
        </div>

        <!-- Section Navigation Tabs -->
        <div class="flex space-x-2 overflow-x-auto no-scrollbar py-1 text-xs">

        </div>

            { section: "tab-priorities", id: "q33", label: "Q33 — Main concerns أبرز المخاوف", isCheckbox: true, entryId: "entry.2016002820", options: ["Incorrect recommendations | توصيات غير صحيحة", "Delayed detection | تأخر الاكتشاف", "Over-reliance on AI | الاعتماد الزائد على الذكاء الاصطناعي", "Lack of clinical validation | عدم التحقق السريري", "Legal responsibility | المسؤولية القانونية", "Data privacy | خصوصية البيانات", "Technical failure | الفشل التقني", "False-positive alerts | الإنذارات الكاذبة"], weights: { pro_ai: [45, 30, 45, 40, 50, 35, 45, 40], balanced: [55, 40, 60, 55, 60, 45, 55, 50], skeptical: [75, 55, 75, 70, 75, 60, 70, 65] } },
            { section: "tab-priorities", id: "q34", label: "Q34 — Digital readiness الجاهزية الرقمية للقسم", entryId: "entry.275052532", options: ["Yes | نعم", "No | لا", "Not sure | غير متأكد"], weights: { pro_ai: [55, 25, 20], balanced: [40, 35, 25], skeptical: [25, 50, 25] } },
            { section: "tab-priorities", id: "q35a", label: "Q35a — Training improves confidence التدريب الرسمي يحسن الثقة", entryId: "entry.1627608447", options: LIKERT_OPTIONS, weights: { pro_ai: [1, 2, 7, 42, 48], balanced: [1, 3, 15, 48, 33], skeptical: [3, 8, 22, 42, 25] } },
            { section: "tab-priorities", id: "q35b", label: "Q35b — Final decision maker من يتخذ القرار النهائي؟", entryId: "entry.741402769", options: ["Physician | الطبيب", "Respiratory Therapist | أخصائي العلاج التنفسي", "Shared decision | قرار مشترك", "Varies by type of decision | يختلف حسب نوع القرار"], weights: { pro_ai: [35, 25, 30, 10], balanced: [40, 20, 30, 10], skeptical: [45, 15, 25, 15] } }
        ];

        let activeTab = "tab-demographics";

        function switchTab(tabId) {
            activeTab = tabId;
            document.querySelectorAll(".tab-btn").forEach(b => {
                b.classList.remove("border-teal-600", "text-teal-700", "font-bold");
                b.classList.add("text-slate-600", "border-slate-200");
            });
            const btn = document.getElementById(`btn-${tabId}`);
            if (btn) {
                btn.classList.add("border-teal-600", "text-teal-700", "font-bold");
                btn.classList.remove("text-slate-600", "border-slate-200");
            }
            renderQuestions();
        }

        function renderQuestions() {
            const container = document.getElementById("questionsContainer");
            container.innerHTML = "";
            const list = surveyQuestions.filter(q => q.section === activeTab);

            list.forEach(q => {
                const card = document.createElement("div");
                card.className = "bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3";

                const header = document.createElement("div");
                header.className = "flex justify-between items-start gap-2 border-b border-slate-100 pb-2";

                const title = document.createElement("h4");
                title.className = "text-xs font-bold text-slate-800 leading-snug";
                title.innerText = q.label;

                const idBadge = document.createElement("span");
                idBadge.className = "text-[9px] font-mono px-1.5 py-0.5 rounded bg-slate-100 text-slate-400";
                idBadge.innerText = q.entryId.replace("entry.", "");

                header.appendChild(title);
                header.appendChild(idBadge);
                card.appendChild(header);

                q.options.forEach((opt, idx) => {
                    const row = document.createElement("div");
                    row.className = "space-y-1";

                    const meta = document.createElement("div");
                    meta.className = "flex justify-between text-[11px] text-slate-600";

                    const optName = document.createElement("span");
                    optName.className = "truncate pr-2 font-medium";
                    optName.innerText = opt;

                    const pctText = document.createElement("span");
                    pctText.id = `${q.id}_pct_${idx}`;
                    pctText.className = "font-bold text-teal-700 font-mono text-xs";
                    const currentVal = q.currentWeights ? q.currentWeights[idx] : q.weights.balanced[idx];
                    pctText.innerText = `${currentVal}%`;

                    meta.appendChild(optName);
                    meta.appendChild(pctText);

                    const slider = document.createElement("input");
                    slider.type = "range";
                    slider.min = "0";
                    slider.max = "100";
                    slider.value = currentVal;
                    slider.className = "w-full h-2 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-teal-600";
                    slider.oninput = (e) => {
                        pctText.innerText = `${e.target.value}%`;
                        if (!q.currentWeights) q.currentWeights = [...q.weights.balanced];
                        q.currentWeights[idx] = parseInt(e.target.value);
                    };

                    row.appendChild(meta);
                    row.appendChild(slider);
                    card.appendChild(row);
                });

                container.appendChild(card);
            });
        }

        function applyPreset(name) {
            surveyQuestions.forEach(q => {
                if (q.weights && q.weights[name]) {
                    q.currentWeights = [...q.weights[name]];
                }
            });
            renderQuestions();
            log(`Applied preset: ${name.toUpperCase()}`, "text-teal-400 font-bold");
        }

        function selectWeightedChoice(options, weights) {
            const sum = weights.reduce((acc, v) => acc + v, 0);
            if (sum === 0) return options[0];
            let rand = Math.random() * sum;
            for (let i = 0; i < options.length; i++) {
                if (rand < weights[i]) return options[i];
                rand -= weights[i];
            }
            return options[0];
        }

        function log(msg, cls = "text-emerald-400") {
            const c = document.getElementById("logConsole");
            const p = document.createElement("p");
            p.className = cls;
            p.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            c.appendChild(p);
            c.scrollTop = c.scrollHeight;
        }

        function clearLogs() {
            document.getElementById("logConsole").innerHTML = `<p class="text-slate-500">// Console cleared.</p>`;
        }

        // Submitter via hidden Form target (Bypasses CORS restrictions)
        function submitViaHiddenForm(formData) {
            const form = document.createElement("form");
            form.method = "POST";
            form.action = SUBMIT_URL;
            form.target = "google_target_iframe";

            for (let [key, val] of formData.entries()) {
                const input = document.createElement("input");
                input.type = "hidden";
                input.name = key;
                input.value = val;
                form.appendChild(input);
            }

            document.body.appendChild(form);
            form.submit();
            document.body.removeChild(form);
        }

        // Execution Controller
        async function runSubmissions() {
            const count = parseInt(document.getElementById("subCount").value) || 10;
            const delay = parseInt(document.getElementById("subDelay").value) || 450;
            const enforceConsent = document.getElementById("enforceConsent").checked;

            const btn = document.getElementById("startBtn");
            const pBox = document.getElementById("progressBox");
            const pBar = document.getElementById("progressBar");
            const pPct = document.getElementById("progressPct");
            const pStat = document.getElementById("progressStatus");

            btn.disabled = true;
            btn.classList.add("bg-slate-400");
            pBox.classList.remove("hidden");

            log(`Dispatching ${count} responses to Google Forms...`, "text-cyan-400 font-bold");

            let successful = 0;

            for (let i = 0; i < count; i++) {
                pStat.innerText = `Submitting ${i + 1} of ${count}...`;

                const formData = new FormData();
                formData.append("pageHistory", "0,1,2,3,4,5,6");

                let profession = "";
                let usedAI = true;

                surveyQuestions.forEach(q => {
                    const weights = q.options.map((_, oIdx) => q.currentWeights ? q.currentWeights[oIdx] : q.weights.balanced[oIdx]);

                    // Q1 Consent
                    if (q.id === "q1" && enforceConsent) {
                        formData.append(q.entryId, "Yes | نعم");
                        return;
                    }
                    // Q3 Physician specialty branch
                    if (q.id === "q3" && !profession.includes("Physician")) {
                        formData.append(q.entryId, "Not Applicaple- لا ينطبق");
                        return;
                    }
                    // Q14 Skip if AI not used
                    if (q.id === "q14" && !usedAI) {
                        return;
                    }

                    if (q.isCheckbox) {
                        let selected = [];
                        q.options.forEach((opt, idx) => {
                            if (Math.random() * 100 < weights[idx]) selected.push(opt);
                        });
                        if (q.maxSelect && selected.length > q.maxSelect) {
                            selected = selected.sort(() => 0.5 - Math.random()).slice(0, q.maxSelect);
                        }
                        if (selected.length === 0) selected.push(selectWeightedChoice(q.options, weights));
                        selected.forEach(v => formData.append(q.entryId, v));
                    } else {
                        const chosen = selectWeightedChoice(q.options, weights);
                        formData.append(q.entryId, chosen);
                        if (q.id === "q2") profession = chosen;
                        if (q.id === "q13") usedAI = chosen.includes("Yes") || chosen.includes("نعم");
                    }
                });

                try {
                    // Send directly into Google's response collector
                    submitViaHiddenForm(formData);
                    successful++;
                    log(`[✓] Submission #${i + 1} filed into Google Forms.`);
                } catch (e) {
                    log(`[!] Error on submission #${i + 1}: ${e.message}`, "text-rose-400");
                }

                const pct = Math.round(((i + 1) / count) * 100);
                pBar.style.width = `${pct}%`;
                pPct.innerText = `${pct}%`;

                if (i < count - 1) await new Promise(r => setTimeout(r, delay));
            }

            pStat.innerText = "Complete!";
            btn.disabled = false;
            btn.classList.remove("bg-slate-400");
            log(`Finished! Total ${successful} responses sent directly to your Google Form.`, "text-amber-300 font-bold");
            alert(`Done! Successfully submitted ${successful} responses.`);
        }

        window.addEventListener("DOMContentLoaded", () => {
            applyPreset("balanced");
        });
    </script>
